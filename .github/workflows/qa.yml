name: QA

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Test
        run: pnpm test

  regression:
    name: Regression probes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run regression probes
        run: node scripts/probes/run-all.mjs
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: probe-evidence-${{ matrix.os }}
          path: probe-artifacts/
          if-no-files-found: ignore

  build:
    name: Build out/ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Prepare sidecar
        run: node scripts/prepare.mjs
      - name: Build
        run: pnpm exec electron-vite build
      - name: SHA256 of build outputs
        shell: bash
        run: |
          mkdir -p dist
          (cd out && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist/out-SHA256SUMS.txt
          cat dist/out-SHA256SUMS.txt
      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-out-${{ matrix.os }}
          path: |
            out/
            dist/out-SHA256SUMS.txt

  gui-smoke:
    name: GUI window smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Prepare sidecar
        run: node scripts/prepare.mjs
      - name: Build
        run: pnpm exec electron-vite build
      - name: Fix chrome-sandbox permissions (Linux)
        if: runner.os == 'Linux'
        run: |
          SANDBOX=$(find node_modules -name chrome-sandbox -path '*electron*' | head -1)
          echo "sandbox helper: $SANDBOX"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
      - name: GUI smoke (silent start)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          PROBE_GUI_SCENARIO: silent
        run: xvfb-run -a node_modules/.bin/electron scripts/probes/gui-window-smoke.mjs
      - name: GUI smoke (control)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          PROBE_GUI_SCENARIO: normal
        run: xvfb-run -a node_modules/.bin/electron scripts/probes/gui-window-smoke.mjs
      - name: GUI smoke (silent start)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          PROBE_GUI_SCENARIO: silent
        run: node_modules\.bin\electron.cmd scripts\probes\gui-window-smoke.mjs
      - name: GUI smoke (control)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          PROBE_GUI_SCENARIO: normal
        run: node_modules\.bin\electron.cmd scripts\probes\gui-window-smoke.mjs
      - name: GUI smoke (silent start, macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          PROBE_GUI_SCENARIO: silent
        run: node_modules/.bin/electron scripts/probes/gui-window-smoke.mjs
      - name: GUI smoke (control, macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          PROBE_GUI_SCENARIO: normal
        run: node_modules/.bin/electron scripts/probes/gui-window-smoke.mjs
      - name: Assert verdicts
        shell: bash
        run: |
          ls -la probe-artifacts/
          jq -e '.ok == true' probe-artifacts/gui-silent-verdict.json
          jq -e '.ok == true' probe-artifacts/gui-normal-verdict.json
          echo '--- silent ---' && cat probe-artifacts/gui-silent-verdict.json
          echo '--- normal ---' && cat probe-artifacts/gui-normal-verdict.json
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gui-evidence-${{ matrix.os }}
          path: probe-artifacts/

  linux-package-smoke:
    name: Linux package install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools desktop-file-utils
      - name: Prepare sidecar
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: pnpm prepare --x64
      - name: Build deb
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: pnpm build:linux --x64
      - name: Install deb
        run: sudo apt-get install -y ./dist/*.deb
      - name: Validate installed desktop entry
        shell: bash
        run: |
          set -euo pipefail
          dpkg-query -W -f='${Status}\n' mihomo-party
          desktop=$(find /usr/share/applications -maxdepth 1 -type f \( -iname '*mihomo*.desktop' -o -iname '*clash*.desktop' \) | head -1)
          test -n "$desktop"
          if desktop-file-validate "$desktop"; then
            :
          else
            validation_status=$?
            if [ "$validation_status" -gt 1 ]; then
              exit "$validation_status"
            fi
            echo "desktop-file-validate reported warnings (status $validation_status); continuing"
          fi
          echo '--- installed package files ---'
          dpkg -L mihomo-party | sed -n '1,160p'
          echo '--- installed /opt entries ---'
          find /opt -maxdepth 3 -type f -perm -111 -print 2>/dev/null | sort || true
          echo '--- desktop entry ---'
          cat "$desktop"
          raw_exec_line=$(sed -n 's/^Exec=//p' "$desktop" | head -1)
          if [[ "$raw_exec_line" == \"*\"* ]]; then
            exec_line=${raw_exec_line#\"}
            exec_line=${exec_line%%\"*}
          else
            exec_line=${raw_exec_line%% *}
          fi
          resolved=''
          if [[ "$exec_line" = /* ]] && [ -x "$exec_line" ]; then
            resolved="$exec_line"
          elif command -v "$exec_line" >/dev/null 2>&1; then
            resolved=$(command -v "$exec_line")
          else
            resolved=$(find /opt -maxdepth 3 -type f -name "$exec_line" -perm -111 2>/dev/null | head -1 || true)
          fi
          test -n "$resolved"
          test -x "$resolved"
          printf '%s\n' "$resolved" > "$RUNNER_TEMP/mihomo-party-exec"
          printf 'desktop=%s\nexec=%s\nresolved=%s\n' "$desktop" "$exec_line" "$resolved"
      - name: Launch installed app under Xvfb
        shell: bash
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/mihomo-party-package-smoke
          XDG_CACHE_HOME: ${{ runner.temp }}/mihomo-party-package-cache
        run: |
          set -u
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          exec_line=$(cat "$RUNNER_TEMP/mihomo-party-exec")
          launch_path="$RUNNER_TEMP/mihomo-party-launcher"
          ln -sf "$exec_line" "$launch_path"
          log="$RUNNER_TEMP/mihomo-party-package-smoke.log"
          set +e
          timeout --signal=TERM 20s xvfb-run -a "$launch_path" >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          pkill -TERM -f "$exec_line" 2>/dev/null || true
          case "$status" in
            0|124|143) exit 0 ;;
            *) exit "$status" ;;
          esac
      - name: Upload package smoke log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-package-smoke-log
          path: ${{ runner.temp }}/mihomo-party-package-smoke.log
          if-no-files-found: ignore